name: Deploy to Hostinger (FTP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # позволяет запускать деплой вручную из вкладки Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    "82.25.113.214"
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      21
          protocol:  ftp
          server-dir: public_html/
          # что НЕ заливать / не трогать на сервере:
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            **/uploads/**
            **/data/*.sqlite*
            config.local.php
            config.example.php
            README-DEPLOY.md
